name: Atualizar perfil e cobrinha

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Atualizar dados do perfil
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Gerar cobrinha em modo claro e escuro
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Raiugami
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar animações na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
